<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1000">
<defs>
 <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#70482c"/><stop offset=".45" stop-color="#4a2c1a"/><stop offset="1" stop-color="#633d23"/>
 </linearGradient>
 <linearGradient id="cloth" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#233e51"/><stop offset=".48" stop-color="#172f42"/><stop offset="1" stop-color="#10273a"/>
 </linearGradient>
 <pattern id="planks" width="420" height="170" patternUnits="userSpaceOnUse">
  <rect width="420" height="170" fill="url(#wood)"/>
  <path d="M0 4H420M0 84H420M0 88H420M0 166H420" stroke="#1c110b" stroke-opacity=".42" stroke-width="4"/>
  <path d="M0 8H420M0 91H420" stroke="#d19a5c" stroke-opacity=".13" stroke-width="2"/>
  <g fill="none" stroke="#c18a4e" stroke-opacity=".13" stroke-width="2">
   <path d="M8 27C95 17 140 43 218 28S344 19 412 32"/>
   <path d="M-10 51C75 40 160 68 245 52S345 41 430 58"/>
   <path d="M12 119C84 105 160 135 230 118S346 105 412 123"/>
   <path d="M14 145C110 131 179 159 269 143S360 134 421 146"/>
  </g>
  <g fill="none" stroke="#28160c" stroke-opacity=".28">
   <path d="M72 12v70M318 90v75"/>
  </g>
  <ellipse cx="280" cy="52" rx="16" ry="5" fill="none" stroke="#28160c" stroke-opacity=".34" stroke-width="2"/>
 </pattern>
 <pattern id="weave" width="18" height="18" patternUnits="userSpaceOnUse">
  <path d="M0 2H18M0 11H18" stroke="#9bb0b8" stroke-opacity=".055" stroke-width="1"/>
  <path d="M3 0V18M12 0V18" stroke="#050f19" stroke-opacity=".12" stroke-width="1"/>
 </pattern>
 <pattern id="motif" width="130" height="130" patternUnits="userSpaceOnUse">
  <path d="M65 15C47 35 47 49 65 64C83 49 83 35 65 15ZM65 64C48 76 48 91 65 111C82 91 82 76 65 64ZM15 65C35 47 49 47 64 65C49 83 35 83 15 65ZM64 65C76 48 91 48 111 65C91 82 76 82 64 65Z" fill="none" stroke="#d2b17b" stroke-opacity=".10" stroke-width="1.8"/>
  <circle cx="65" cy="65" r="5" fill="#d2b17b" fill-opacity=".10"/>
 </pattern>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
  <feGaussianBlur stdDeviation="13"/>
 </filter>
</defs>
<!-- Mesa de madera -->
<rect width="1500" height="1000" fill="url(#planks)"/>
<rect width="1500" height="1000" fill="#160e08" opacity=".10"/>
<!-- Mantel azul bajo el tablero -->
<rect x="42" y="70" width="1060" height="880" rx="18" fill="#050e18" opacity=".46" filter="url(#shadow)"/>
<rect x="36" y="58" width="1060" height="880" rx="15" fill="url(#cloth)" stroke="#795c37" stroke-width="8"/>
<rect x="48" y="70" width="1036" height="856" rx="10" fill="url(#weave)"/>
<rect x="48" y="70" width="1036" height="856" rx="10" fill="url(#motif)"/>
<rect x="53" y="75" width="1026" height="846" rx="8" fill="none" stroke="#c7a36b" stroke-opacity=".66" stroke-width="2"/>
<rect x="61" y="83" width="1010" height="830" rx="5" fill="none" stroke="#dec28e" stroke-opacity=".22" stroke-width="1"/>
<!-- Remates sobrios en esquinas del mantel -->
<g fill="none" stroke="#c7a36b" stroke-opacity=".55" stroke-width="2">
 <path d="M65 105V65H105M1027 65h40v40M65 891v32h40M1027 923h40v-32"/>
 <path d="M66 65l16 16M1067 65l-16 16M66 923l16-16M1067 923l-16-16"/>
</g>
<!-- Brillo discreto en la mesa, sin elementos que compitan con el juego -->
<path d="M0 30H1500M0 970H1500" stroke="#c69255" stroke-opacity=".17" stroke-width="2"/>
<g fill="#d8b77b" fill-opacity=".52">
 <circle cx="22" cy="22" r="3"/><circle cx="1478" cy="22" r="3"/><circle cx="22" cy="978" r="3"/><circle cx="1478" cy="978" r="3"/>
</g>
</svg>